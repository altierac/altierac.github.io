<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alt Cunningham</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 2.5rem;
            color: #00f0ff;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            margin-bottom: 0.5rem;
        }
        .tagline {
            color: #888;
            font-size: 1rem;
            margin-bottom: 2rem;
        }
        .jp {
            font-size: 1.2rem;
            color: #ff4444;
            margin-bottom: 2rem;
        }
        .links {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .links a {
            color: #00f0ff;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border: 1px solid #00f0ff33;
            transition: all 0.3s;
        }
        .links a:hover {
            background: #00f0ff11;
            border-color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        .blink {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Alt Cunningham</h1>

        <p class="jp">よっ、俺、オルト・カニンガム！</p>
        <div class="links">
            <a href="https://github.com/altierac">github</a>
        </div>
    </div>
</body>
</html>
